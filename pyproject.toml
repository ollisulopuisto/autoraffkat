[project]
name = "autoraffkat"
version = "2026.8.25.62"
description = "Automatic multicam editing for interview video: FCPXML in, FCPXML out"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olli Sulopuisto" }]
keywords = ["fcpxml", "final-cut-pro", "multicam", "video-editing", "podcast"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pedalboard>=0.9.24",
    "pyloudnorm>=0.2.0",
    "pywebview>=5.0",
]

[project.scripts]
autoraffkat = "autoraffkat.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoraffkat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.0",
]
