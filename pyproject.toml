[project]
name = "autoraffkat"
version = "0.1.0"
description = "Automaattinen monikameraleikkaus FCPXML:stä FCPXML:ksi"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
autoraffkat = "autoraffkat.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoraffkat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
