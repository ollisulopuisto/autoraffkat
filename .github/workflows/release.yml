name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-13, macos-14]
        include:
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Fetch bundled binaries
        run: uv run python scripts/fetch_binaries.py --os darwin

      - name: Build macOS App
        run: uv run python scripts/build_app.py --clean

      - name: Create DMG
        run: |
          cd dist
          hdiutil create -volname "autoraffkat" -srcfolder autoraffkat.app -ov -format UDZO autoraffkat-macos-${{ matrix.arch }}.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoraffkat-macos-${{ matrix.arch }}
          path: dist/autoraffkat-macos-${{ matrix.arch }}.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Fetch bundled binaries
        run: uv run python scripts/fetch_binaries.py --os windows

      - name: Build Windows App
        run: uv run python scripts/build_app.py --clean

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/autoraffkat -DestinationPath dist/autoraffkat-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoraffkat-windows-x64
          path: dist/autoraffkat-windows-x64.zip

  publish-release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
