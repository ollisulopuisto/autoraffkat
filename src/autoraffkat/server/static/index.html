<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoraffkat</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="titles">
    <h1 id="project-name">—</h1>
    <p id="project-meta" class="muted"></p>
  </div>
  <div class="actions">
    <span id="status" class="muted"></span>
    <button id="reload" class="ghost" title="Lue XML uudestaan">Lue uudestaan</button>
    <button id="export" class="primary">Vie XML <kbd>⌘E</kbd></button>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<main>
  <section class="panel tracks">
    <h2>Raidat</h2>
    <div id="track-list"></div>
    <datalist id="speaker-names"></datalist>
  </section>

  <section class="panel globals">
    <h2>Globaalit säätimet</h2>
    <div id="global-list"></div>

    <h3>Pitkä puheenvuoro</h3>
    <div id="longtake-params"></div>
    <div id="longtake-rules" class="rules"></div>

    <h3>Päällekkäispuhe</h3>
    <div id="overlap-rules" class="rules"></div>
    <div id="overlap-params"></div>

    <h3>Ääni</h3>
    <div id="audio-panel"></div>
    <datalist id="plugin-names"></datalist>

    <h3>Projekti</h3>
    <label class="field">
      <span>Nimi</span>
      <input id="project-title" type="text" autocomplete="off">
    </label>
    <p class="muted small" id="paths"></p>
  </section>
</main>

<section class="panel preview">
  <div class="preview-head">
    <h2>Esikatselu</h2>
    <span id="counts" class="muted"></span>
  </div>
  <canvas id="bar" height="120"></canvas>
  <div id="ruler" class="ruler"></div>
  <div id="legend" class="legend"></div>
</section>

<section class="panel cuts">
  <div class="preview-head">
    <h2>Leikkauslista</h2>
    <span id="cut-summary" class="muted"></span>
  </div>
  <div class="table-wrap">
    <table id="cut-table">
      <thead><tr><th>#</th><th>Alku</th><th>Loppu</th><th>Kesto</th><th>Kuva</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<script src="/static/app.js"></script>
</body>
</html>
