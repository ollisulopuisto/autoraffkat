<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2127"/>
      <stop offset="100%" stop-color="#131519"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ea3ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2a03d"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ea8fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2a03d"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Squircle Body -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#2c313a" stroke-width="8"/>

  <!-- Cat Ears / Silhouette Contour -->
  <path d="M 130 370 C 110 310 110 240 150 145 L 205 210 C 235 195 277 195 307 210 L 362 145 C 402 240 402 310 382 370 C 330 420 182 420 130 370 Z" fill="none" stroke="#6b7280" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Left: Audio Waveform (Electric Blue) -->
  <g stroke="url(#blueGlow)" stroke-width="12" stroke-linecap="round">
    <line x1="165" y1="285" x2="165" y2="335" />
    <line x1="190" y1="255" x2="190" y2="365" />
    <line x1="215" y1="235" x2="215" y2="385" />
    <line x1="240" y1="275" x2="240" y2="345" />
  </g>

  <!-- Right: Film Splicing / Multicam Blocks (Amber Orange) -->
  <g stroke="url(#orangeGlow)" stroke-width="8" fill="none">
    <rect x="280" y="240" width="34" height="42" rx="6" fill="#f2a03d" fill-opacity="0.3"/>
    <rect x="325" y="240" width="34" height="42" rx="6" fill="#f2a03d" fill-opacity="0.3"/>
    <rect x="280" y="295" width="34" height="42" rx="6" fill="#f2a03d" fill-opacity="0.3"/>
    <rect x="325" y="295" width="34" height="42" rx="6" fill="#f2a03d" fill-opacity="0.3"/>
    <circle cx="297" cy="360" r="5" fill="#f2a03d"/>
    <circle cx="342" cy="360" r="5" fill="#f2a03d"/>
  </g>

  <!-- Diagonal Laser Splicing Cut Blade -->
  <line x1="72" y1="440" x2="440" y2="72" stroke="url(#laserGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="72" y1="440" x2="440" y2="72" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>
